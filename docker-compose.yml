services:
  postgres:
    image: postgres:16-alpine
    container_name: otec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: otec_db
      POSTGRES_USER: otec
      POSTGRES_PASSWORD: otec
      TZ: America/Santiago
      PGTZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otec -d otec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data: